[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Assignment A: interaction ledger and reporting pipeline"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14,<0.15"]

[tool.setuptools]
packages = ["ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT"]
